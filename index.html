<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>施工風險評估報告書產生工具</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">▤</span>
      <div>
        <div class="brand-title">施工風險評估報告書產生工具</div>
        <div class="brand-sub">設計階段 · 依母本架構產出新案報告</div>
      </div>
    </div>
    <div class="top-actions">
      <label class="proj-name">專案名稱 <input id="projectName" type="text" value="新案A"></label>
      <button class="btn" id="btnSaveProject" title="把專案資料、分類確認、規則存成 .json">儲存專案檔</button>
      <label class="btn" title="開啟先前儲存的 .json 專案檔">開啟專案檔<input id="fileProject" type="file" accept=".json" hidden></label>
      <button class="btn ghost" id="btnReset" title="清除所有設定，回到預設">全部重設</button>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" id="nav"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="busy" id="busy" hidden><div class="busy-box"><div class="spinner"></div><div id="busyMsg">處理中…</div></div></div>
  <div class="toasts" id="toasts"></div>

  <script src="js/vendor/jszip.min.js"></script>
  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/docx.js"></script>
  <script src="js/kb.js"></script>
  <script src="js/gen.js"></script>
  <script src="js/check.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
